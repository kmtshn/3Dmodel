<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>診断モード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #121212; color: #eee; font-family: sans-serif; }
        #log-area {
            padding: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .ok { color: #4ade80; }
        .err { color: #f87171; }
        .info { color: #60a5fa; }
        .step { color: #facc15; font-weight: bold; }
        h1 { padding: 12px 16px; margin: 0; border-bottom: 1px solid #333; background: #1e1e1e; }
    </style>
</head>
<body>

<h1 class="text-base font-bold">🔬 import 診断モード</h1>
<div id="log-area"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
}
</script>

<script type="module">
    const logArea = document.getElementById('log-area');

    function addLog(msg, cls = "") {
        const time = new Date().toLocaleTimeString('ja-JP', { hour12: false }) +
                     '.' + String(Date.now() % 1000).padStart(3, '0');
        const line = document.createElement('div');
        line.className = cls;
        line.textContent = `[${time}] ${msg}`;
        logArea.appendChild(line);
        console.log("[DIAG]", msg);
    }

    function logStep(msg) { addLog("▶ " + msg, "step"); }
    function logOk(msg)   { addLog("✓ " + msg, "ok"); }
    function logInfo(msg) { addLog("  " + msg, "info"); }
    function logErr(msg)  { addLog("✗ " + msg, "err"); }

    addLog("スクリプト開始", "info");
    addLog(`UserAgent: ${navigator.userAgent}`, "info");
    addLog(`URL: ${location.href}`, "info");
    addLog(`Protocol: ${location.protocol}`, "info");

    window.addEventListener('error', (e) => {
        logErr(`window.error: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
    });
    window.addEventListener('unhandledrejection', (e) => {
        const r = e.reason;
        logErr(`unhandledrejection: ${r && r.message ? r.message : r}`);
        if (r && r.stack) logErr(r.stack);
    });

    // タイムアウト付き
    function withTimeout(promise, ms, label) {
        return Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} timeout ${ms}ms`)), ms))
        ]);
    }

    (async () => {
        try {
            // ============ 1. three ============
            logStep("(1/6) three.js を import...");
            const t0 = performance.now();
            const THREE = await withTimeout(import('three'), 15000, "three");
            logOk(`three OK (${Math.round(performance.now() - t0)}ms)`);
            logInfo(`THREE.REVISION = ${THREE.REVISION}`);

            // ============ 2. OrbitControls ============
            logStep("(2/6) OrbitControls を import...");
            const t1 = performance.now();
            const { OrbitControls } = await withTimeout(
                import('three/addons/controls/OrbitControls.js'),
                15000, "OrbitControls"
            );
            logOk(`OrbitControls OK (${Math.round(performance.now() - t1)}ms)`);
            logInfo(`typeof OrbitControls = ${typeof OrbitControls}`);

            // ============ 3. GLTFLoader ============
            logStep("(3/6) GLTFLoader を import...");
            const t2 = performance.now();
            const { GLTFLoader } = await withTimeout(
                import('three/addons/loaders/GLTFLoader.js'),
                15000, "GLTFLoader"
            );
            logOk(`GLTFLoader OK (${Math.round(performance.now() - t2)}ms)`);
            logInfo(`typeof GLTFLoader = ${typeof GLTFLoader}`);

            // ============ 4. MediaPipe ============
            logStep("(4/6) MediaPipe tasks-vision を import...");
            const t3 = performance.now();
            const mp = await withTimeout(
                import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs'),
                30000, "MediaPipe"
            );
            logOk(`MediaPipe OK (${Math.round(performance.now() - t3)}ms)`);
            logInfo(`exports: ${Object.keys(mp).slice(0, 20).join(', ')}`);
            logInfo(`PoseLandmarker: ${typeof mp.PoseLandmarker}`);
            logInfo(`FilesetResolver: ${typeof mp.FilesetResolver}`);

            if (!mp.PoseLandmarker || !mp.FilesetResolver) {
                throw new Error("MediaPipe のエクスポート不足");
            }

            // ============ 5. FilesetResolver ============
            logStep("(5/6) FilesetResolver.forVisionTasks...");
            const t4 = performance.now();
            const vision = await withTimeout(
                mp.FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                ),
                30000, "FilesetResolver"
            );
            logOk(`FilesetResolver OK (${Math.round(performance.now() - t4)}ms)`);

            // ============ 6. モデルダウンロード ============
            logStep("(6/6) AIモデル取得...");
            const t5 = performance.now();
            const modelUrl = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
            const response = await withTimeout(fetch(modelUrl), 30000, "model fetch");
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const buf = await response.arrayBuffer();
            logOk(`モデル取得 OK (${Math.round(performance.now() - t5)}ms, ${Math.round(buf.byteLength / 1024)} KB)`);

            // ============ 7. PoseLandmarker 生成 ============
            logStep("(追加) PoseLandmarker.createFromOptions (GPU)...");
            const t6 = performance.now();
            let poseLandmarker;
            try {
                poseLandmarker = await withTimeout(
                    mp.PoseLandmarker.createFromOptions(vision, {
                        baseOptions: { modelAssetBuffer: new Uint8Array(buf), delegate: "GPU" },
                        runningMode: "VIDEO",
                        numPoses: 1
                    }),
                    20000, "PoseLandmarker(GPU)"
                );
                logOk(`PoseLandmarker(GPU) OK (${Math.round(performance.now() - t6)}ms)`);
            } catch (gpuErr) {
                logErr(`GPU失敗: ${gpuErr.message}, CPUで再試行`);
                const t7 = performance.now();
                poseLandmarker = await withTimeout(
                    mp.PoseLandmarker.createFromOptions(vision, {
                        baseOptions: { modelAssetBuffer: new Uint8Array(buf), delegate: "CPU" },
                        runningMode: "VIDEO",
                        numPoses: 1
                    }),
                    20000, "PoseLandmarker(CPU)"
                );
                logOk(`PoseLandmarker(CPU) OK (${Math.round(performance.now() - t7)}ms)`);
            }

            addLog("", "");
            logOk("🎉 全工程成功！本番コードもこの環境で動くはずです。");

        } catch (err) {
            logErr(`エラー: ${err.message || err}`);
            if (err.stack) logErr(err.stack);
        }
    })();
</script>

</body>
</html>
