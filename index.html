<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web 3D Motion Capture - 安定版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<style>
body{margin:0;overflow:hidden;background:#0f172a;touch-action:none;font-family:system-ui,-apple-system,sans-serif}
#canvas-container{position:relative;width:100%;flex:1;background:#0f172a}
#main-canvas{display:block;width:100%;height:100%}

#video-wrap{
  position:absolute; right:10px; bottom:50px;
  width:420px; max-width:60vw;
  border:2px solid #60a5fa; border-radius:6px;
  background:#000; z-index:35;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  resize: both; overflow:hidden;
  min-width:160px; min-height:90px;
}
#video-drag-handle{
  position:absolute; left:0; top:0; right:0; height:22px;
  background:rgba(59,130,246,.9); cursor:move; z-index:37;
  display:flex; align-items:center; gap:6px; padding:0 6px;
  user-select:none;
}
#video-drag-handle .ttl{color:#fff;font-size:10px;font-weight:bold}
#input-video{
  display:block; width:100%; height:100%;
  object-fit:contain; background:#000; padding-top:22px; box-sizing:border-box;
}
#video-controls{
  position:absolute; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.65); z-index:38;
  display:flex; align-items:center; gap:6px; padding:3px 6px;
}
#video-controls button{
  background:#334155;color:#e2e8f0;border:1px solid #475569;border-radius:4px;
  font-size:12px;padding:1px 6px;cursor:pointer;line-height:1.4;
}
#video-controls button:hover{background:#475569}
#seek-bar{flex:1;height:4px}
#time-text{color:#cbd5e1;font-size:9px;white-space:nowrap}
#video-size-hint{
  position:absolute; right:4px; bottom:24px;
  color:#94a3b8; font-size:9px; pointer-events:none;
  background:rgba(0,0,0,.5); padding:1px 4px; border-radius:3px;
}

#loading-overlay{position:absolute;inset:0;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px;text-align:center}
#error-box{display:none;position:absolute;top:10px;left:10px;right:10px;background:rgba(220,38,38,.95);color:#fff;padding:10px;border-radius:6px;font-size:11px;z-index:60;white-space:pre-wrap;max-height:50vh;overflow:auto}
#debug-panel{position:absolute;top:60px;right:10px;background:rgba(0,0,0,.6);color:#34d399;font-family:monospace;font-size:10px;padding:6px;border-radius:4px;z-index:40;pointer-events:none;min-width:160px}
.view-label{position:absolute;color:#94a3b8;font-size:10px;font-weight:bold;pointer-events:none;z-index:30;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:3px}
.view-label.hidden{display:none}
.btn{padding:6px 10px;border-radius:6px;font-size:12px;background:#334155;color:#e2e8f0;border:1px solid #475569;cursor:pointer;transition:all .2s}
.btn:hover{background:#475569}
.btn.active{background:#3b82f6;border-color:#60a5fa;color:#fff}
.progress-bar{width:280px;height:8px;background:#334155;border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .2s;width:0%}
</style>
</head>
<body class="text-gray-200 h-screen flex flex-col">

<header class="bg-slate-800 border-b border-slate-700 px-3 py-2 flex flex-wrap items-center gap-2">
  <h1 class="text-sm font-bold flex-shrink-0">🎬 3D Motion Capture</h1>
  <label class="btn flex-shrink-0">📁 動画を選択<input type="file" id="file-input" accept="video/*" class="hidden"></label>
  <div class="flex gap-1 flex-shrink-0">
    <button class="btn active" data-view="avatar">🧍 3D</button>
    <button class="btn" data-view="stick">🦴 骨格</button>
    <button class="btn" data-view="both">🧍🦴 両方</button>
  </div>
  <div class="flex gap-1 flex-shrink-0">
    <label class="text-xs text-gray-400">人数:</label>
    <select id="num-persons" class="btn">
      <option value="1" selected>1人</option>
      <option value="2">2人</option>
      <option value="3">3人</option>
    </select>
  </div>
  <button id="reset-btn" class="btn flex-shrink-0">🔄 基準リセット</button>
  <button id="flip-btn" class="btn flex-shrink-0">🔃 前後反転</button>
  <button id="layout-btn" class="btn flex-shrink-0">🗔 4分割表示</button>
  <button id="toggle-video-btn" class="btn flex-shrink-0">📹 動画表示</button>
  <button id="video-size-btn" class="btn flex-shrink-0">🔍 動画サイズ</button>
</header>

<div id="canvas-container">
  <canvas id="main-canvas"></canvas>
  <div id="video-wrap">
    <div id="video-drag-handle"><span class="ttl">📹 INPUT</span></div>
    <video id="input-video" playsinline muted></video>
    <div id="video-size-hint">右下ドラッグでリサイズ</div>
    <div id="video-controls">
      <button id="play-btn" title="再生/一時停止">▶</button>
      <button id="back-btn" title="5秒戻る">⏪</button>
      <button id="fwd-btn" title="5秒進む">⏩</button>
      <input id="seek-bar" type="range" min="0" max="1000" value="0">
      <span id="time-text">0:00 / 0:00</span>
    </div>
  </div>
  <div class="view-label" id="lbl-persp" style="left:8px;top:8px">PERSPECTIVE</div>
  <div class="view-label hidden" id="lbl-front">FRONT</div>
  <div class="view-label hidden" id="lbl-side">SIDE</div>
  <div class="view-label hidden" id="lbl-top">TOP</div>
  <div id="debug-panel">待機中...</div>
  <div id="error-box"></div>
  <div id="loading-overlay">
    <div class="text-lg font-bold mb-2">🤖 AIの準備をしています</div>
    <div id="status-text" class="text-sm text-gray-300">初期化中...</div>
    <div id="sub-status" class="text-xs text-gray-500 mt-1">&nbsp;</div>
    <div id="progress-container" class="progress-bar hidden"><div id="progress-fill" class="progress-fill"></div></div>
  </div>
</div>

<footer class="bg-slate-800 border-t border-slate-700 px-3 py-1 text-xs text-gray-400">
  <span id="footer-info">準備完了後に動画を選択してください</span>
</footer>

<script type="module">
const statusText = document.getElementById('status-text');
const subStatus = document.getElementById('sub-status');
const overlay = document.getElementById('loading-overlay');
const errorBox = document.getElementById('error-box');
const progressContainer = document.getElementById('progress-container');
const progressFill = document.getElementById('progress-fill');
const debugPanel = document.getElementById('debug-panel');
const footerInfo = document.getElementById('footer-info');
const video = document.getElementById('input-video');
const videoWrap = document.getElementById('video-wrap');
const canvas = document.getElementById('main-canvas');

let currentStep = '初期化前';
function setStep(label, sub=''){ currentStep=label; statusText.innerText=label; subStatus.innerText=sub; }
function showError(msg){ errorBox.style.display='block'; errorBox.innerText=`直前ステップ: ${currentStep}\n\n${msg}`; console.error(msg); }
window.addEventListener('error', e => showError(`window.error: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', e => {
  const msg = e.reason?.message || String(e.reason||'');
  if(msg.includes('message channel closed') || msg.includes('listener indicated')) return;
  showError(`unhandledrejection: ${msg}\n${e.reason?.stack||''}`);
});

// ===== 前後反転トグル =====
let forwardFlip = false;
document.getElementById('flip-btn').addEventListener('click', (ev) => {
  forwardFlip = !forwardFlip;
  ev.currentTarget.classList.toggle('active', forwardFlip);
});

// ===== レイアウト: false=単一PERSPECTIVE, true=4分割 =====
let quadView = false;

let videoVisible = true;
document.getElementById('toggle-video-btn').addEventListener('click', () => {
  videoVisible = !videoVisible;
  videoWrap.style.display = videoVisible ? 'block' : 'none';
});

// ===== 動画サイズプリセット =====
const videoSizes = ['small','medium','large','xlarge'];
const sizeMap = { small:'240px', medium:'420px', large:'600px', xlarge:'820px' };
let videoSizeIdx = 1;
document.getElementById('video-size-btn').addEventListener('click', () => {
  videoSizeIdx = (videoSizeIdx + 1) % videoSizes.length;
  videoWrap.style.width = sizeMap[videoSizes[videoSizeIdx]];
  videoWrap.style.height = '';
  fitVideoHeight();
});
function fitVideoHeight(){
  if(!video.videoWidth) return;
  const w = videoWrap.offsetWidth;
  const ratio = video.videoHeight / Math.max(video.videoWidth,1);
  videoWrap.style.height = (w * ratio + 44) + 'px';
}
video.addEventListener('loadedmetadata', fitVideoHeight);

// ===== 動画ウィンドウのドラッグ移動 =====
(function(){
  const handle = document.getElementById('video-drag-handle');
  let dragging=false, sx=0, sy=0, startLeft=0, startTop=0;
  function onDown(e){
    dragging=true;
    const pt = e.touches ? e.touches[0] : e;
    sx=pt.clientX; sy=pt.clientY;
    const r = videoWrap.getBoundingClientRect();
    const cr = videoWrap.parentElement.getBoundingClientRect();
    startLeft = r.left - cr.left;
    startTop  = r.top  - cr.top;
    videoWrap.style.left = startLeft+'px';
    videoWrap.style.top  = startTop+'px';
    videoWrap.style.right='auto';
    videoWrap.style.bottom='auto';
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - sx, dy = pt.clientY - sy;
    const cr = videoWrap.parentElement.getBoundingClientRect();
    let nl = startLeft + dx, nt = startTop + dy;
    nl = Math.max(0, Math.min(nl, cr.width  - videoWrap.offsetWidth));
    nt = Math.max(0, Math.min(nt, cr.height - videoWrap.offsetHeight));
    videoWrap.style.left = nl+'px';
    videoWrap.style.top  = nt+'px';
    e.preventDefault();
  }
  function onUp(){ dragging=false; }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
})();

// ===== 動画コントロール =====
(function(){
  const playBtn = document.getElementById('play-btn');
  const backBtn = document.getElementById('back-btn');
  const fwdBtn  = document.getElementById('fwd-btn');
  const seek    = document.getElementById('seek-bar');
  const timeTxt = document.getElementById('time-text');
  function fmt(t){ if(!isFinite(t))t=0; const m=Math.floor(t/60); const s=Math.floor(t%60); return `${m}:${String(s).padStart(2,'0')}`; }
  playBtn.addEventListener('click', () => { if(video.paused) video.play().catch(()=>{}); else video.pause(); });
  backBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 5); });
  fwdBtn.addEventListener('click', () => { video.currentTime = Math.min(video.duration||0, video.currentTime + 5); });
  video.addEventListener('play',  () => playBtn.innerText='⏸');
  video.addEventListener('pause', () => playBtn.innerText='▶');
  let seeking=false;
  seek.addEventListener('input', () => { seeking=true; if(video.duration) video.currentTime = (seek.value/1000)*video.duration; });
  seek.addEventListener('change', () => { seeking=false; });
  video.addEventListener('timeupdate', () => {
    if(video.duration && !seeking) seek.value = (video.currentTime/video.duration)*1000;
    timeTxt.innerText = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
  });
})();

// ===== パラメータ =====
const POSE_SMOOTH      = 0.35;
const POS_SMOOTH       = 0.25;
const VISIBILITY_TH    = 0.5;
const ORTHO_HALF_HEIGHT = 1.5;
const ORTHO_CENTER_Y    = 0.9;
const GROUND_OFFSET    = 0.02;
const MIN_DISTANCE_HEIGHT_RATIO = 0.75;
const SCENE_WIDTH      = 6.0;
const REF_DISTANCE     = 4.0;
const MAX_PERSONS      = 3;
const LOST_GRACE       = 15; // 未検出を許容するフレーム数

let lastTs = 0;
let lastVideoTime = -1;
let baselineHeightPx = 0;

async function main(){
  setStep('three.js 読み込み中...');
  const THREE = await import('three');
  setStep('アドオン読み込み中...');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { clone: skeletonClone } = await import('three/addons/utils/SkeletonUtils.js');
  setStep('MediaPipe 読み込み中...');
  const mp = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs');
  const { PoseLandmarker, FilesetResolver } = mp;

  setStep('3D空間構築中...');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.Fog(0x0f172a, 12, 35);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(3, 8, 4); dl.castShadow = true;
  dl.shadow.mapSize.set(2048,2048);
  dl.shadow.camera.left=-6; dl.shadow.camera.right=6;
  dl.shadow.camera.top=6; dl.shadow.camera.bottom=-6;
  scene.add(dl);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30,30),
    new THREE.MeshStandardMaterial({color:0x1e293b, roughness:0.85})
  );
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);
  scene.add(new THREE.GridHelper(30, 30, 0x475569, 0x334155));

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.setScissorTest(true);

  const camPersp = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camPersp.position.set(5, 3.5, 7);
  camPersp.lookAt(0, 0.9, 0);
  const camFront = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camFront.position.set(0, ORTHO_CENTER_Y, 10); camFront.lookAt(0, ORTHO_CENTER_Y, 0);
  const camSide = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camSide.position.set(10, ORTHO_CENTER_Y, 0); camSide.lookAt(0, ORTHO_CENTER_Y, 0);
  const camTop = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camTop.position.set(0, 15, 0); camTop.lookAt(0, 0, 0); camTop.up.set(0,0,-1);

  const controls = new OrbitControls(camPersp, canvas);
  controls.target.set(0, 0.9, 0);
  controls.enableDamping = true;
  controls.minDistance = 2;
  controls.maxDistance = 30;

  function updateOrthoCam(cam, w, h){
    const aspect = w / Math.max(h, 1);
    const halfH = ORTHO_HALF_HEIGHT * 1.5;
    const halfW = halfH * aspect;
    cam.left = -halfW; cam.right = halfW;
    cam.top = halfH; cam.bottom = -halfH;
    cam.updateProjectionMatrix();
  }

  setStep('キャラクターモデル読み込み中...');
  const XBOT_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/models/gltf/Xbot.glb';
  const gltfTemplate = await new Promise((resolve, reject) => {
    new GLTFLoader().load(XBOT_URL, resolve, undefined, err => reject(new Error('GLTF: '+err.message)));
  });

  const PERSON_COLORS = [0xef4444, 0x3b82f6, 0x10b981];
  const STICK_BONES = [
    [11,13],[13,15],[12,14],[14,16],
    [11,12],[23,24],[11,23],[12,24],
    [23,25],[25,27],[27,31],
    [24,26],[26,28],[28,32],
  ];

  function measureBindDirs(avatar){
    avatar.updateMatrixWorld(true);
    const bones = {};
    avatar.traverse(o => { if(o.isBone) bones[o.name] = o; });
    function localChildDir(parent, child){
      if(!parent || !child) return new THREE.Vector3(0,1,0);
      const pw = new THREE.Vector3(); parent.getWorldPosition(pw);
      const cw = new THREE.Vector3(); child.getWorldPosition(cw);
      const dirW = cw.sub(pw).normalize();
      const pq = new THREE.Quaternion(); parent.getWorldQuaternion(pq);
      return dirW.applyQuaternion(pq.invert()).normalize();
    }
    return {
      lShoulder: localChildDir(bones.mixamorigLeftArm, bones.mixamorigLeftForeArm),
      lElbow:    localChildDir(bones.mixamorigLeftForeArm, bones.mixamorigLeftHand),
      rShoulder: localChildDir(bones.mixamorigRightArm, bones.mixamorigRightForeArm),
      rElbow:    localChildDir(bones.mixamorigRightForeArm, bones.mixamorigRightHand),
      lHip:      localChildDir(bones.mixamorigLeftUpLeg, bones.mixamorigLeftLeg),
      lKnee:     localChildDir(bones.mixamorigLeftLeg, bones.mixamorigLeftFoot),
      rHip:      localChildDir(bones.mixamorigRightUpLeg, bones.mixamorigRightLeg),
      rKnee:     localChildDir(bones.mixamorigRightLeg, bones.mixamorigRightFoot),
      spine:     localChildDir(bones.mixamorigSpine, bones.mixamorigSpine1),
      spine1:    localChildDir(bones.mixamorigSpine1, bones.mixamorigSpine2),
      neck:      localChildDir(bones.mixamorigNeck, bones.mixamorigHead),
    };
  }

  class Person {
    constructor(id, bindDirs){
      this.id = id;
      this.color = PERSON_COLORS[id % PERSON_COLORS.length];
      this.bindDirs = bindDirs;

      this.avatar = skeletonClone(gltfTemplate.scene);
      this.avatar.traverse(o => {
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
          if(o.material){
            o.material = o.material.clone();
            if(o.material.color) o.material.color.setHex(this.color);
          }
        }
      });
      scene.add(this.avatar);

      const bn = {};
      this.avatar.traverse(o => { if(o.isBone) bn[o.name] = o; });
      this.B = {
        hips: bn.mixamorigHips,
        spine: bn.mixamorigSpine,
        spine1: bn.mixamorigSpine1,
        spine2: bn.mixamorigSpine2,
        neck: bn.mixamorigNeck,
        head: bn.mixamorigHead,
        lShoulder: bn.mixamorigLeftArm,
        lElbow: bn.mixamorigLeftForeArm,
        rShoulder: bn.mixamorigRightArm,
        rElbow: bn.mixamorigRightForeArm,
        lHip: bn.mixamorigLeftUpLeg,
        lKnee: bn.mixamorigLeftLeg,
        lAnkle: bn.mixamorigLeftFoot,
        rHip: bn.mixamorigRightUpLeg,
        rKnee: bn.mixamorigRightLeg,
        rAnkle: bn.mixamorigRightFoot,
      };
      this.bindHipsPos = this.B.hips.position.clone();
      this.bindHipsQuat = this.B.hips.quaternion.clone();

      this.avatar.updateMatrixWorld(true);
      const hp = new THREE.Vector3(); this.B.hips.getWorldPosition(hp);
      const ap = new THREE.Vector3(); this.B.lAnkle.getWorldPosition(ap);
      this.xbotHipToFoot = Math.abs(hp.y - ap.y);

      this.stickGroup = new THREE.Group();
      scene.add(this.stickGroup);
      this.joints = [];
      const jMat = new THREE.MeshStandardMaterial({color:this.color});
      const jGeo = new THREE.SphereGeometry(0.03, 12, 12);
      for(let i=0;i<33;i++){
        const m = new THREE.Mesh(jGeo, jMat);
        m.castShadow = true;
        this.stickGroup.add(m); this.joints.push(m);
      }
      const bMat = new THREE.MeshStandardMaterial({color:0x60a5fa});
      this.sticks = STICK_BONES.map(()=>{
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1,8), bMat);
        m.castShadow = true; this.stickGroup.add(m); return m;
      });

      this.smoothedHip = new THREE.Vector3();
      this.smoothedHipQuat = new THREE.Quaternion().copy(this.bindHipsQuat);
      this.posInited = false;
      this.active = false;
      this.lostFrames = LOST_GRACE + 1;
      this.groundLift = 0;
    }
    setVisible(showAvatar, showStick){
      this.avatar.visible = this.active && showAvatar;
      this.stickGroup.visible = this.active && showStick;
    }
    resetPose(){
      this.B.hips.quaternion.copy(this.bindHipsQuat);
      this.B.hips.position.copy(this.bindHipsPos);
      this.avatar.position.set(0,0,0);
      this.groundLift = 0;
      this.smoothedHipQuat.copy(this.bindHipsQuat);
      this.smoothedHip.set(0,0,0);
    }
  }

  const tempAvatar = skeletonClone(gltfTemplate.scene);
  scene.add(tempAvatar);
  const bindDirs = measureBindDirs(tempAvatar);
  scene.remove(tempAvatar);

  const persons = [];
  for(let i=0;i<MAX_PERSONS;i++) persons.push(new Person(i, bindDirs));

  // 動画アップ前のデフォルト表示: 1人目を待機ポーズで表示
  persons[0].active = true;
  persons[0].resetPose();

  let viewMode = 'avatar';
  function refreshVisibility(){
    const sa = (viewMode === 'avatar' || viewMode === 'both');
    const ss = (viewMode === 'stick' || viewMode === 'both');
    persons.forEach(p => p.setVisible(sa, ss));
  }
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      viewMode = btn.dataset.view;
      refreshVisibility();
    });
  });

  // レイアウト切替
  document.getElementById('layout-btn').addEventListener('click', (ev) => {
    quadView = !quadView;
    ev.currentTarget.classList.toggle('active', quadView);
    ev.currentTarget.innerText = quadView ? '🗗 単一表示' : '🗔 4分割表示';
  });

  setStep('AIエンジン初期化中...');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
  setStep('AIモデルダウンロード中...');
  progressContainer.classList.remove('hidden');
  const modelUrl = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
  const res = await fetch(modelUrl);
  const reader = res.body.getReader();
  const total = parseInt(res.headers.get('content-length')||'12000000', 10);
  let received = 0; const chunks = [];
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value); received += value.length;
    progressFill.style.width = Math.min(100, received/total*100)+'%';
  }
  const buf = new Uint8Array(received);
  let off=0; for(const c of chunks){ buf.set(c, off); off+=c.length; }
  progressContainer.classList.add('hidden');

  let numPosesWanted = parseInt(document.getElementById('num-persons').value, 10);
  let poseLandmarker;
  async function createPoseLandmarker(numPoses){
    if(poseLandmarker){ try{ poseLandmarker.close(); }catch(e){} }
    try {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions:{modelAssetBuffer:buf, delegate:'GPU'},
        runningMode:'VIDEO', numPoses
      });
    } catch(e) {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions:{modelAssetBuffer:buf, delegate:'CPU'},
        runningMode:'VIDEO', numPoses
      });
    }
  }
  await createPoseLandmarker(numPosesWanted);
  document.getElementById('num-persons').addEventListener('change', async e => {
    numPosesWanted = parseInt(e.target.value, 10);
    setStep('検出器を再構築中...');
    overlay.style.display = 'flex';
    await createPoseLandmarker(numPosesWanted);
    overlay.style.display = 'none';
    persons.forEach((p,i) => { p.active = (i===0 && !video.src); p.posInited = false; p.lostFrames = LOST_GRACE+1; p.resetPose(); });
    refreshVisibility();
  });

  overlay.style.display = 'none';
  footerInfo.innerText = '✓ 準備完了。動画を選択してください。';

  document.getElementById('file-input').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    if(video.src) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(f);
    persons.forEach(p => { p.active = false; p.posInited = false; p.lostFrames = LOST_GRACE+1; p.resetPose(); });
    refreshVisibility();
    lastTs = 0; lastVideoTime = -1;
    baselineHeightPx = 0;
    video.play().catch(()=>{});
    footerInfo.innerText = `▶ 解析中: ${f.name}`;
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    persons.forEach(p => { p.posInited = false; p.resetPose(); });
    baselineHeightPx = 0;
    footerInfo.innerText = '🔄 基準リセット完了';
  });

  // ========== 姿勢適用ロジック ==========
  function lmToVec3(lm, out){ out.set(lm.x, -lm.y, -lm.z); return out; }

  const _curDirWorld = new THREE.Vector3();
  const _vd = new THREE.Vector3();
  const _va = new THREE.Vector3();
  const _vb = new THREE.Vector3();
  const _parentQ = new THREE.Quaternion();
  const _targetQ = new THREE.Quaternion();

  function setBoneDirection(bone, dirWorld, bindDirLocal, smooth=POSE_SMOOTH){
    if(!bone || !bone.parent) return;
    if(dirWorld.lengthSq() < 1e-8) return;
    bone.parent.updateWorldMatrix(true, false);
    bone.parent.getWorldQuaternion(_parentQ);
    const dirLocal = _vd.copy(dirWorld).applyQuaternion(_parentQ.clone().invert()).normalize();
    _targetQ.setFromUnitVectors(bindDirLocal, dirLocal);
    bone.quaternion.slerp(_targetQ, smooth);
  }
  function dirBetween(lmA, lmB, out){
    lmToVec3(lmB, _vb);
    lmToVec3(lmA, _va);
    return out.copy(_vb).sub(_va).normalize();
  }
  function landmarkVisible(lm){
    return lm && (lm.visibility === undefined || lm.visibility >= VISIBILITY_TH);
  }

  function applyPose(person, world){
    const L = world;
    if(!L[11] || !L[12] || !L[23] || !L[24]) return;

    const lSh = lmToVec3(L[11], new THREE.Vector3());
    const rSh = lmToVec3(L[12], new THREE.Vector3());
    const lHip = lmToVec3(L[23], new THREE.Vector3());
    const rHip = lmToVec3(L[24], new THREE.Vector3());

    const hipMid = new THREE.Vector3().addVectors(lHip, rHip).multiplyScalar(0.5);
    const shMid  = new THREE.Vector3().addVectors(lSh, rSh).multiplyScalar(0.5);

    const up = new THREE.Vector3().subVectors(shMid, hipMid).normalize();
    const right = new THREE.Vector3().subVectors(lSh, rSh).normalize();
    let fwd = new THREE.Vector3().crossVectors(right, up).normalize();
    if(forwardFlip) fwd.multiplyScalar(-1);
    const right2 = new THREE.Vector3().crossVectors(up, fwd).normalize();

    if(up.lengthSq() > 1e-6 && fwd.lengthSq() > 1e-6){
      const m = new THREE.Matrix4().makeBasis(right2, up, fwd);
      const worldQuat = new THREE.Quaternion().setFromRotationMatrix(m);
      person.B.hips.parent.updateWorldMatrix(true, false);
      const parentWQ = new THREE.Quaternion();
      person.B.hips.parent.getWorldQuaternion(parentWQ);
      const localQuat = parentWQ.invert().multiply(worldQuat);
      person.smoothedHipQuat.slerp(localQuat, POSE_SMOOTH);
      person.B.hips.quaternion.copy(person.smoothedHipQuat);
    }

    person.avatar.updateMatrixWorld(true);

    if(landmarkVisible(L[11]) && landmarkVisible(L[13]))
      setBoneDirection(person.B.lShoulder, dirBetween(L[11], L[13], _curDirWorld), person.bindDirs.lShoulder);
    if(landmarkVisible(L[13]) && landmarkVisible(L[15]))
      setBoneDirection(person.B.lElbow, dirBetween(L[13], L[15], _curDirWorld), person.bindDirs.lElbow);
    if(landmarkVisible(L[12]) && landmarkVisible(L[14]))
      setBoneDirection(person.B.rShoulder, dirBetween(L[12], L[14], _curDirWorld), person.bindDirs.rShoulder);
    if(landmarkVisible(L[14]) && landmarkVisible(L[16]))
      setBoneDirection(person.B.rElbow, dirBetween(L[14], L[16], _curDirWorld), person.bindDirs.rElbow);
    if(landmarkVisible(L[23]) && landmarkVisible(L[25]))
      setBoneDirection(person.B.lHip, dirBetween(L[23], L[25], _curDirWorld), person.bindDirs.lHip);
    if(landmarkVisible(L[25]) && landmarkVisible(L[27]))
      setBoneDirection(person.B.lKnee, dirBetween(L[25], L[27], _curDirWorld), person.bindDirs.lKnee);
    if(landmarkVisible(L[24]) && landmarkVisible(L[26]))
      setBoneDirection(person.B.rHip, dirBetween(L[24], L[26], _curDirWorld), person.bindDirs.rHip);
    if(landmarkVisible(L[26]) && landmarkVisible(L[28]))
      setBoneDirection(person.B.rKnee, dirBetween(L[26], L[28], _curDirWorld), person.bindDirs.rKnee);
  }

  function placePerson(person, normalized){
    if(!normalized[23] || !normalized[24]) return;
    let topY = Math.min(normalized[11].y, normalized[12].y);
    let botY = Math.max(
      (normalized[27]?normalized[27].y:normalized[23].y),
      (normalized[28]?normalized[28].y:normalized[24].y)
    );
    let heightNorm = Math.max(botY - topY, 0.05);
    if(baselineHeightPx === 0) baselineHeightPx = heightNorm;
    const ratio = Math.max(heightNorm / baselineHeightPx, MIN_DISTANCE_HEIGHT_RATIO);
    const dist = REF_DISTANCE / ratio;

    const cx = (normalized[23].x + normalized[24].x)/2;
    const worldX = (cx - 0.5) * SCENE_WIDTH;
    const worldZ = -(dist - REF_DISTANCE);

    if(!person.posInited){
      person.smoothedHip.set(worldX, 0, worldZ);
      person.posInited = true;
    } else {
      person.smoothedHip.x += (worldX - person.smoothedHip.x) * POS_SMOOTH;
      person.smoothedHip.z += (worldZ - person.smoothedHip.z) * POS_SMOOTH;
    }
    person.avatar.position.x = person.smoothedHip.x;
    person.avatar.position.z = person.smoothedHip.z;

    // 接地: 足首ワールドYが床(0)に来るよう avatar.position.y を目標値追従
    person.avatar.updateMatrixWorld(true);
    const lAnkleW = new THREE.Vector3(); person.B.lAnkle.getWorldPosition(lAnkleW);
    const rAnkleW = new THREE.Vector3(); person.B.rAnkle.getWorldPosition(rAnkleW);
    const footY = Math.min(lAnkleW.y, rAnkleW.y);
    const targetY = person.avatar.position.y - footY + GROUND_OFFSET;
    person.avatar.position.y += (targetY - person.avatar.position.y) * POS_SMOOTH;
  }

  const _p1 = new THREE.Vector3();
  const _p2 = new THREE.Vector3();
  const _mid = new THREE.Vector3();
  const _yAxis = new THREE.Vector3(0,1,0);
  function updateStick(person, world){
    const baseX = person.avatar.position.x;
    const baseZ = person.avatar.position.z;
    const baseY = person.avatar.position.y + person.xbotHipToFoot;
    for(let i=0;i<33;i++){
      const lm = world[i];
      if(!lm){ person.joints[i].visible=false; continue; }
      person.joints[i].visible=true;
      person.joints[i].position.set(baseX + lm.x, baseY - lm.y, baseZ - lm.z);
    }
    STICK_BONES.forEach((pair, idx) => {
      const a = person.joints[pair[0]], b = person.joints[pair[1]], stick = person.sticks[idx];
      if(!a.visible || !b.visible){ stick.visible=false; return; }
      stick.visible=true;
      _p1.copy(a.position); _p2.copy(b.position);
      _mid.copy(_p1).add(_p2).multiplyScalar(0.5);
      stick.position.copy(_mid);
      const len = _p1.distanceTo(_p2);
      stick.scale.set(1, Math.max(len,0.001), 1);
      stick.quaternion.setFromUnitVectors(_yAxis, _vd.copy(_p2).sub(_p1).normalize());
    });
  }

  // ========== メインループ ==========
  function detectAndRender(){
    requestAnimationFrame(detectAndRender);

    if(video.src && video.readyState >= 2 && !video.paused && video.currentTime !== lastVideoTime){
      lastVideoTime = video.currentTime;
      const ts = performance.now();
      if(ts <= lastTs){ lastTs += 1; } else { lastTs = ts; }
      try {
        const result = poseLandmarker.detectForVideo(video, lastTs);
        const worldArr = result.worldLandmarks || [];
        const normArr = result.landmarks || [];
        const n = Math.min(worldArr.length, persons.length);
        for(let i=0;i<persons.length;i++){
          const p = persons[i];
          if(i < n && worldArr[i] && worldArr[i].length >= 33){
            p.lostFrames = 0;
            p.active = true;
            applyPose(p, worldArr[i]);
            placePerson(p, normArr[i]);
            updateStick(p, worldArr[i]);
          } else {
            // 未検出: 猶予フレーム内は前姿勢を保持
            p.lostFrames++;
            if(p.lostFrames > LOST_GRACE) p.active = false;
          }
        }
        refreshVisibility();
        const detected = persons.filter(p=>p.active).length;
        debugPanel.innerText = `検出: ${n} / 表示: ${detected}\nvideo t: ${video.currentTime.toFixed(2)}s\nflip: ${forwardFlip}\nview: ${quadView?'4分割':'単一'}`;
      } catch(err){
        debugPanel.innerText = '検出エラー:\n' + (err.message||err);
      }
    }

    controls.update();

    const W = canvas.clientWidth, H = canvas.clientHeight;
    if(canvas.width !== Math.floor(W*renderer.getPixelRatio()) || canvas.height !== Math.floor(H*renderer.getPixelRatio())){
      renderer.setSize(W, H, false);
    }
    const pr = renderer.getPixelRatio();

    function renderView(cam, x, y, w, h){
      renderer.setViewport(Math.floor(x*pr), Math.floor(y*pr), Math.floor(w*pr), Math.floor(h*pr));
      renderer.setScissor(Math.floor(x*pr), Math.floor(y*pr), Math.floor(w*pr), Math.floor(h*pr));
      if(cam.isPerspectiveCamera){ cam.aspect=w/Math.max(h,1); cam.updateProjectionMatrix(); }
      else { updateOrthoCam(cam, w, h); }
      renderer.render(scene, cam);
    }

    const lblPersp = document.getElementById('lbl-persp');
    const lblFront = document.getElementById('lbl-front');
    const lblSide  = document.getElementById('lbl-side');
    const lblTop   = document.getElementById('lbl-top');

    if(quadView){
      const halfW = Math.floor(W/2), halfH = Math.floor(H/2);
      renderView(camPersp, 0,     halfH, halfW,   H-halfH);
      renderView(camFront, halfW, halfH, W-halfW, H-halfH);
      renderView(camSide,  0,     0,     halfW,   halfH);
      renderView(camTop,   halfW, 0,     W-halfW, halfH);
      lblPersp.classList.remove('hidden');
      lblFront.classList.remove('hidden');
      lblSide.classList.remove('hidden');
      lblTop.classList.remove('hidden');
      lblPersp.style.cssText = `left:8px;top:8px`;
      lblFront.style.cssText = `left:${halfW+8}px;top:8px`;
      lblSide.style.cssText  = `left:8px;top:${halfH+8}px`;
      lblTop.style.cssText   = `left:${halfW+8}px;top:${halfH+8}px`;
    } else {
      renderView(camPersp, 0, 0, W, H);
      lblPersp.classList.remove('hidden');
      lblPersp.style.cssText = `left:8px;top:8px`;
      lblFront.classList.add('hidden');
      lblSide.classList.add('hidden');
      lblTop.classList.add('hidden');
    }
  }

  function onResize(){ renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); }
  window.addEventListener('resize', onResize);
  onResize();
  refreshVisibility();
  detectAndRender();
}

main().catch(err => showError('main() 失敗: ' + (err && (err.stack || err.message) || err)));
</script>
</body>
</html>
