<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Motion AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; touch-action: none; }
        .view-label {
            position: absolute;
            font: 10px/1.2 ui-monospace, monospace;
            color: #9ca3af;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px; border-radius: 3px;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-gray-200 h-screen flex flex-col font-sans">

    <header class="p-3 md:p-4 bg-[#1e1e1e] border-b border-[#333] flex justify-between items-center z-10 shadow-md">
        <h1 class="text-base md:text-xl font-bold tracking-wider text-blue-400">3D MOTION AI</h1>
        <div class="flex items-center gap-2 flex-wrap">
            <div class="flex gap-1 text-xs">
                <button data-mode="model" class="view-btn px-2 py-1 rounded bg-blue-600 text-white">3D</button>
                <button data-mode="stick" class="view-btn px-2 py-1 rounded bg-gray-700 text-gray-200">骨格</button>
                <button data-mode="both"  class="view-btn px-2 py-1 rounded bg-gray-700 text-gray-200">両方</button>
            </div>
            <input type="file" id="video-upload" accept="video/mp4,video/mov,video/webm" class="hidden">
            <button id="upload-btn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-400 text-sm md:text-base px-3 py-2 rounded-full font-semibold transition-colors shadow">
                動画を選択
            </button>
        </div>
    </header>

    <div class="flex-1 flex flex-col p-2 gap-2 overflow-hidden bg-[#0a0a0a]">
        <div class="flex-1 bg-black rounded-lg border border-[#333] relative overflow-hidden flex justify-center items-center shadow-lg">
            <video id="input-video" class="max-h-full max-w-full object-contain" controls loop playsinline muted></video>

            <div id="overlay" class="absolute inset-0 bg-[#111] bg-opacity-95 flex flex-col items-center justify-center z-10 transition-opacity duration-500 p-6 text-center">
                <div id="spinner" class="animate-spin rounded-full h-10 w-10 border-4 border-gray-600 border-t-blue-500 mb-4"></div>
                <p id="status-text" class="text-base md:text-lg font-medium tracking-wide">起動中...</p>
                <p id="sub-status" class="text-xs md:text-sm text-gray-400 mt-2 mb-4">しばらくお待ちください</p>

                <div id="progress-container" class="w-full max-w-xs hidden">
                    <div class="w-full bg-gray-700 rounded-full h-2.5 mb-1 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-sm font-bold text-blue-400">0%</p>
                </div>

                <div id="error-box" class="hidden mt-4 p-3 bg-red-900/40 border border-red-500/50 rounded text-red-200 text-xs text-left w-full max-w-md break-all overflow-y-auto max-h-48 whitespace-pre-wrap"></div>
            </div>
        </div>

        <div id="canvas-container" class="flex-1 bg-[#1a1a1a] rounded-lg border border-[#333] relative overflow-hidden shadow-lg">
            <div id="label-perspective" class="view-label">PERSPECTIVE</div>
            <div id="label-front" class="view-label">FRONT</div>
            <div id="label-side"  class="view-label">SIDE</div>
            <div id="label-top"   class="view-label">TOP</div>
            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur px-2 py-1 text-[10px] text-gray-300 rounded border border-gray-700 pointer-events-none z-10">
                左上ビュー: スワイプで回転
            </div>
        </div>
    </div>

    <script type="module">
        const video = document.getElementById('input-video');
        const canvasContainer = document.getElementById('canvas-container');
        const uploadBtn = document.getElementById('upload-btn');
        const videoUpload = document.getElementById('video-upload');
        const overlay = document.getElementById('overlay');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('status-text');
        const subStatus = document.getElementById('sub-status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const errorBox = document.getElementById('error-box');
        const labelPerspective = document.getElementById('label-perspective');
        const labelFront = document.getElementById('label-front');
        const labelSide = document.getElementById('label-side');
        const labelTop = document.getElementById('label-top');
        const viewBtns = document.querySelectorAll('.view-btn');

        let currentStep = "init";
        function setStep(label, sub = "") {
            currentStep = label;
            statusText.innerText = label;
            if (sub) subStatus.innerText = sub;
            console.log("[STEP]", label, sub);
        }
        function showError(msg, details = "") {
            spinner.classList.add('hidden');
            progressContainer.classList.add('hidden');
            statusText.innerText = msg;
            statusText.classList.add('text-red-400');
            subStatus.innerText = `直前ステップ: ${currentStep}`;
            errorBox.classList.remove('hidden');
            errorBox.innerText = details || "(詳細なし)";
        }
        window.addEventListener('error', (e) => {
            showError("予期せぬエラー", `${e.message}\n${e.filename}:${e.lineno}:${e.colno}`);
        });
        window.addEventListener('unhandledrejection', (e) => {
            const r = e.reason;
            const msg = r && r.message ? r.message : String(r);
            if (msg.includes('message channel closed')) return;
            showError("非同期エラー", `${msg}\n${r && r.stack ? r.stack : ''}`);
        });

        function withTimeout(promise, ms, label) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} がタイムアウト(${ms}ms)`)), ms))
            ]);
        }
        async function fetchWithProgress(url, onProgress) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`ダウンロード失敗: HTTP ${response.status} (${url})`);
            const total = parseInt(response.headers.get('content-length') || '0', 10);
            let loaded = 0;
            const reader = response.body.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value); loaded += value.length;
                if (total) onProgress(Math.round(loaded/total*100)); else onProgress(-1, loaded);
            }
            const buffer = new Uint8Array(loaded); let offset = 0;
            for (const c of chunks) { buffer.set(c, offset); offset += c.length; }
            return buffer;
        }

        async function main() {
            try {
                setStep("手順(1/6): three.js を読み込み中...");
                const THREE = await withTimeout(import('three'), 15000, "three");
                setStep("手順(2/6): アドオン読み込み中...");
                const { OrbitControls } = await withTimeout(import('three/addons/controls/OrbitControls.js'), 15000, "OrbitControls");
                const { GLTFLoader } = await withTimeout(import('three/addons/loaders/GLTFLoader.js'), 15000, "GLTFLoader");
                setStep("手順(3/6): MediaPipe を読み込み中...");
                const mp = await withTimeout(
                    import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs'),
                    30000, "MediaPipe"
                );
                const { PoseLandmarker, FilesetResolver } = mp;
                if (!PoseLandmarker || !FilesetResolver) throw new Error("MediaPipe エクスポート不足");

                setStep("手順(4/6): 3D空間を準備中...");

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.setScissorTest(true);
                canvasContainer.appendChild(renderer.domElement);

                // ===== カメラ =====
                // Perspective（自由視点）
                const persCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
                persCam.position.set(2.5, 1.6, 3.5);

                // Ortho 用：画面に映したい縦方向の半幅（メートル）
                // Xbot身長 ≈ 1.7m なので、ちょい余裕を持って ±1.3m （計2.6m）に
                const ORTHO_HALF_HEIGHT = 1.3;
                const ORTHO_CENTER_Y = 0.9;

                // Front（正面：被写体の Z+ から見る）
                const frontCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
                frontCam.position.set(0, ORTHO_CENTER_Y, 5);
                frontCam.lookAt(0, ORTHO_CENTER_Y, 0);

                // Side（側面：被写体の X+ から見る）
                const sideCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
                sideCam.position.set(5, ORTHO_CENTER_Y, 0);
                sideCam.lookAt(0, ORTHO_CENTER_Y, 0);

                // Top（上面：Y+ から見下ろす）
                const topCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
                topCam.position.set(0, 5, 0);
                topCam.lookAt(0, 0, 0);
                topCam.up.set(0, 0, -1);

                const controls = new OrbitControls(persCam, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, ORTHO_CENTER_Y, 0);

                scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                dirLight.position.set(3, 6, 3);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.set(1024, 1024);
                dirLight.shadow.camera.left = -3;
                dirLight.shadow.camera.right = 3;
                dirLight.shadow.camera.top = 5;
                dirLight.shadow.camera.bottom = -1;
                scene.add(dirLight);

                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(20, 20),
                    new THREE.MeshStandardMaterial({ color: 0x222831, roughness: 0.9 })
                );
                floor.rotation.x = -Math.PI / 2;
                floor.receiveShadow = true;
                scene.add(floor);
                const grid = new THREE.GridHelper(10, 10, 0x444444, 0x2a2a2a);
                grid.position.y = 0.01;
                scene.add(grid);

                setStep("手順(5/6): キャラクターモデル読み込み中...");
                const XBOT_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/models/gltf/Xbot.glb';
                const gltfLoader = new GLTFLoader();
                const gltf = await withTimeout(
                    new Promise((resolve, reject) => {
                        gltfLoader.load(XBOT_URL, resolve,
                            (xhr) => {
                                if (xhr.lengthComputable) subStatus.innerText = `モデル取得中: ${Math.round(xhr.loaded/xhr.total*100)}%`;
                            },
                            (err) => reject(new Error(`GLTF読み込み失敗: ${err && err.message ? err.message : err}`))
                        );
                    }),
                    30000, "GLTF"
                );

                const avatar = gltf.scene;
                avatar.traverse(o => {
                    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
                });
                scene.add(avatar);

                const bones = {};
                avatar.traverse(o => { if (o.isBone) bones[o.name] = o; });

                const B = {
                    hips:      bones['mixamorigHips'],
                    lArm:      bones['mixamorigLeftArm'],
                    lForeArm:  bones['mixamorigLeftForeArm'],
                    lHand:     bones['mixamorigLeftHand'],
                    rArm:      bones['mixamorigRightArm'],
                    rForeArm:  bones['mixamorigRightForeArm'],
                    rHand:     bones['mixamorigRightHand'],
                    lUpLeg:    bones['mixamorigLeftUpLeg'],
                    lLeg:      bones['mixamorigLeftLeg'],
                    lFoot:     bones['mixamorigLeftFoot'],
                    rUpLeg:    bones['mixamorigRightUpLeg'],
                    rLeg:      bones['mixamorigRightLeg'],
                    rFoot:     bones['mixamorigRightFoot'],
                };
                if (!B.hips) throw new Error("Hips ボーンが見つかりません。");

                avatar.updateMatrixWorld(true);
                const bindHipsLocalPos = B.hips.position.clone();

                const _vA = new THREE.Vector3();
                const _vB = new THREE.Vector3();
                function worldDir(a, b) {
                    a.getWorldPosition(_vA); b.getWorldPosition(_vB);
                    return new THREE.Vector3().subVectors(_vB, _vA).normalize();
                }
                const bindDir = {
                    lArm: worldDir(B.lArm, B.lForeArm), lForeArm: worldDir(B.lForeArm, B.lHand),
                    rArm: worldDir(B.rArm, B.rForeArm), rForeArm: worldDir(B.rForeArm, B.rHand),
                    lUpLeg: worldDir(B.lUpLeg, B.lLeg), lLeg: worldDir(B.lLeg, B.lFoot),
                    rUpLeg: worldDir(B.rUpLeg, B.rLeg), rLeg: worldDir(B.rLeg, B.rFoot),
                };
                const bindWorldQuat = {};
                for (const k of Object.keys(B)) {
                    if (!B[k]) continue;
                    bindWorldQuat[k] = new THREE.Quaternion();
                    B[k].getWorldQuaternion(bindWorldQuat[k]);
                }
                const bindHipsWorldQuatInv = bindWorldQuat.hips.clone().invert();

                // スティック
                const stickGroup = new THREE.Group();
                scene.add(stickGroup);
                const stickJoints = [];
                const jointGeo = new THREE.SphereGeometry(0.025, 12, 12);
                const jointMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });
                for (let i = 0; i < 33; i++) {
                    const s = new THREE.Mesh(jointGeo, jointMat);
                    if (i >= 1 && i <= 10) s.visible = false;
                    stickGroup.add(s);
                    stickJoints.push(s);
                }
                const STICK_CONNECTIONS = [
                    [11,12], [11,23], [12,24], [23,24],
                    [11,13], [13,15],
                    [12,14], [14,16],
                    [23,25], [25,27], [27,31],
                    [24,26], [26,28], [28,32],
                ];
                const stickLineMat = new THREE.LineBasicMaterial({ color: 0xffffff });
                const stickLines = STICK_CONNECTIONS.map(() => {
                    const g = new THREE.BufferGeometry();
                    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
                    const line = new THREE.Line(g, stickLineMat);
                    stickGroup.add(line);
                    return line;
                });

                let viewMode = 'model';
                function applyViewMode() {
                    avatar.visible = (viewMode === 'model' || viewMode === 'both');
                    stickGroup.visible = (viewMode === 'stick' || viewMode === 'both');
                }
                applyViewMode();
                viewBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        viewMode = btn.dataset.mode;
                        viewBtns.forEach(b => {
                            b.classList.remove('bg-blue-600', 'text-white');
                            b.classList.add('bg-gray-700', 'text-gray-200');
                        });
                        btn.classList.remove('bg-gray-700', 'text-gray-200');
                        btn.classList.add('bg-blue-600', 'text-white');
                        applyViewMode();
                    });
                });

                setStep("手順(6/6): AIエンジン初期化中...");
                const vision = await withTimeout(
                    FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"),
                    30000, "FilesetResolver"
                );

                setStep("AIモデルをダウンロード中...");
                progressContainer.classList.remove('hidden');
                const modelUrl = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
                const modelBuffer = await fetchWithProgress(modelUrl, (pct, loaded) => {
                    if (pct >= 0) { progressBar.style.width = `${pct}%`; progressText.innerText = `${pct}%`; }
                    else { progressText.innerText = `${Math.round(loaded/1024/1024*10)/10} MB`; progressBar.style.width = '100%'; }
                });
                progressContainer.classList.add('hidden');

                setStep("最終調整中...");
                let poseLandmarker;
                try {
                    poseLandmarker = await withTimeout(
                        PoseLandmarker.createFromOptions(vision, {
                            baseOptions: { modelAssetBuffer: modelBuffer, delegate: "GPU" },
                            runningMode: "VIDEO", numPoses: 1
                        }), 20000, "PoseLandmarker(GPU)"
                    );
                } catch (gpuErr) {
                    console.warn("GPU失敗、CPUで再試行:", gpuErr);
                    poseLandmarker = await withTimeout(
                        PoseLandmarker.createFromOptions(vision, {
                            baseOptions: { modelAssetBuffer: modelBuffer, delegate: "CPU" },
                            runningMode: "VIDEO", numPoses: 1
                        }), 20000, "PoseLandmarker(CPU)"
                    );
                }

                spinner.classList.add('hidden');
                statusText.innerText = "準備完了！";
                subStatus.innerText = "上の「動画を選択」ボタンから動画を選んでください";
                uploadBtn.disabled = false;
                setTimeout(() => {
                    if (video.src === "") overlay.style.backgroundColor = "rgba(17, 17, 17, 0.7)";
                }, 1000);

                uploadBtn.addEventListener('click', () => videoUpload.click());
                videoUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.classList.add('hidden'), 500);
                    if (video.src) URL.revokeObjectURL(video.src);
                    video.src = URL.createObjectURL(file);
                    video.load();
                    video.play().catch(err => console.warn('再生開始に失敗:', err));
                    firstFrame = true; lastVideoTime = -1; baselineSet = false; posInited = false;
                });

                // ===== 移動関連（前回より控えめに） =====
                const HORIZONTAL_SCALE = 3.0;
                const DEPTH_SCALE      = 1.0;
                const POSE_SMOOTH = 0.4;
                const POS_SMOOTH = 0.15;

                const lm = new Array(33).fill(null).map(() => new THREE.Vector3());
                const lmRaw = new Array(33).fill(null).map(() => new THREE.Vector3());
                let firstFrame = true;
                let baselineSet = false;
                let baseImgX = 0, baseWorldZ = 0;
                const targetHipPos = new THREE.Vector3();
                const currentHipPos = new THREE.Vector3();
                let posInited = false;

                const _qDelta = new THREE.Quaternion();
                const _qTargetWorld = new THREE.Quaternion();
                const _qParentWorld = new THREE.Quaternion();
                const _qParentInv = new THREE.Quaternion();

                function applyBoneByDirection(bone, bindDirVec, currentDirVec, bindWorldQ) {
                    if (!bone || currentDirVec.lengthSq() < 1e-8) return;
                    currentDirVec.normalize();
                    _qDelta.setFromUnitVectors(bindDirVec, currentDirVec);
                    _qTargetWorld.multiplyQuaternions(_qDelta, bindWorldQ);
                    if (bone.parent && bone.parent.isBone) {
                        bone.parent.getWorldQuaternion(_qParentWorld);
                        _qParentInv.copy(_qParentWorld).invert();
                        bone.quaternion.copy(_qParentInv).multiply(_qTargetWorld);
                    } else {
                        bone.quaternion.copy(_qTargetWorld);
                    }
                }

                let lastVideoTime = -1;
                let lastTs = 0;
                const tmpA = new THREE.Vector3();
                const tmpHipRight = new THREE.Vector3();
                const tmpHipMid = new THREE.Vector3();
                const tmpShoulderMid = new THREE.Vector3();
                const tmpUp = new THREE.Vector3();
                const tmpFwd = new THREE.Vector3();
                const tmpTrueUp = new THREE.Vector3();
                const tmpMat = new THREE.Matrix4();
                const tmpHipWorldQuat = new THREE.Quaternion();
                const tmpFootL = new THREE.Vector3();
                const tmpFootR = new THREE.Vector3();
                const hipWorldPos = new THREE.Vector3();

                function updatePose() {
                    if (!(video.readyState >= 2 && !video.paused && video.currentTime !== lastVideoTime && poseLandmarker)) return;
                    lastVideoTime = video.currentTime;
                    lastTs = Math.max(lastTs + 1, Math.round(performance.now()));

                    try {
                        const results = poseLandmarker.detectForVideo(video, lastTs);
                        const hasImg = results.landmarks && results.landmarks.length > 0;
                        const hasWorld = results.worldLandmarks && results.worldLandmarks.length > 0;
                        if (!hasWorld) return;

                        const w = results.worldLandmarks[0];
                        for (let i = 0; i < 33; i++) {
                            lmRaw[i].set(w[i].x, -w[i].y, -w[i].z);
                        }
                        if (firstFrame) {
                            for (let i = 0; i < 33; i++) lm[i].copy(lmRaw[i]);
                            firstFrame = false;
                        } else {
                            for (let i = 0; i < 33; i++) lm[i].lerp(lmRaw[i], POSE_SMOOTH);
                        }

                        let dx = 0, dz = 0;
                        if (hasImg) {
                            const img = results.landmarks[0];
                            const imgHipX = (img[23].x + img[24].x) * 0.5;
                            const worldHipZ = (w[23].z + w[24].z) * 0.5;
                            if (!baselineSet) {
                                baseImgX = imgHipX; baseWorldZ = worldHipZ;
                                baselineSet = true;
                            }
                            dx = (imgHipX - baseImgX) * HORIZONTAL_SCALE;
                            dz = -(worldHipZ - baseWorldZ) * DEPTH_SCALE;
                        }

                        B.hips.position.set(bindHipsLocalPos.x + dx, bindHipsLocalPos.y, bindHipsLocalPos.z + dz);

                        tmpHipMid.addVectors(lm[23], lm[24]).multiplyScalar(0.5);
                        tmpHipRight.subVectors(lm[23], lm[24]).normalize();
                        tmpShoulderMid.addVectors(lm[11], lm[12]).multiplyScalar(0.5);
                        tmpUp.subVectors(tmpShoulderMid, tmpHipMid).normalize();
                        tmpFwd.crossVectors(tmpHipRight, tmpUp).normalize();
                        tmpTrueUp.crossVectors(tmpFwd, tmpHipRight).normalize();
                        tmpMat.makeBasis(tmpHipRight, tmpTrueUp, tmpFwd);
                        tmpHipWorldQuat.setFromRotationMatrix(tmpMat);
                        B.hips.quaternion.copy(tmpHipWorldQuat).multiply(bindHipsWorldQuatInv);

                        avatar.updateMatrixWorld(true);

                        tmpA.subVectors(lm[13], lm[11]).normalize();
                        applyBoneByDirection(B.lArm, bindDir.lArm, tmpA, bindWorldQuat.lArm);
                        avatar.updateMatrixWorld(true);
                        tmpA.subVectors(lm[15], lm[13]).normalize();
                        applyBoneByDirection(B.lForeArm, bindDir.lForeArm, tmpA, bindWorldQuat.lForeArm);

                        tmpA.subVectors(lm[14], lm[12]).normalize();
                        applyBoneByDirection(B.rArm, bindDir.rArm, tmpA, bindWorldQuat.rArm);
                        avatar.updateMatrixWorld(true);
                        tmpA.subVectors(lm[16], lm[14]).normalize();
                        applyBoneByDirection(B.rForeArm, bindDir.rForeArm, tmpA, bindWorldQuat.rForeArm);

                        tmpA.subVectors(lm[25], lm[23]).normalize();
                        applyBoneByDirection(B.lUpLeg, bindDir.lUpLeg, tmpA, bindWorldQuat.lUpLeg);
                        avatar.updateMatrixWorld(true);
                        tmpA.subVectors(lm[27], lm[25]).normalize();
                        applyBoneByDirection(B.lLeg, bindDir.lLeg, tmpA, bindWorldQuat.lLeg);

                        tmpA.subVectors(lm[26], lm[24]).normalize();
                        applyBoneByDirection(B.rUpLeg, bindDir.rUpLeg, tmpA, bindWorldQuat.rUpLeg);
                        avatar.updateMatrixWorld(true);
                        tmpA.subVectors(lm[28], lm[26]).normalize();
                        applyBoneByDirection(B.rLeg, bindDir.rLeg, tmpA, bindWorldQuat.rLeg);

                        avatar.updateMatrixWorld(true);

                        // しゃがみ対応：足の最低点を Y=0 に
                        B.lFoot.getWorldPosition(tmpFootL);
                        B.rFoot.getWorldPosition(tmpFootR);
                        const minFootY = Math.min(tmpFootL.y, tmpFootR.y);
                        const newHipY = B.hips.position.y - minFootY;
                        targetHipPos.set(B.hips.position.x, newHipY, B.hips.position.z);

                        if (!posInited) {
                            currentHipPos.copy(targetHipPos);
                            posInited = true;
                        } else {
                            currentHipPos.lerp(targetHipPos, POS_SMOOTH);
                        }
                        B.hips.position.copy(currentHipPos);
                        avatar.updateMatrixWorld(true);

                        // スティック更新
                        B.hips.getWorldPosition(hipWorldPos);
                        const lmHipY = (lm[23].y + lm[24].y) * 0.5;
                        for (let i = 0; i < 33; i++) {
                            stickJoints[i].position.set(
                                hipWorldPos.x + lm[i].x,
                                hipWorldPos.y + lm[i].y - lmHipY,
                                hipWorldPos.z + lm[i].z
                            );
                        }
                        STICK_CONNECTIONS.forEach((conn, i) => {
                            const p1 = stickJoints[conn[0]].position;
                            const p2 = stickJoints[conn[1]].position;
                            const arr = stickLines[i].geometry.attributes.position.array;
                            arr[0]=p1.x; arr[1]=p1.y; arr[2]=p1.z;
                            arr[3]=p2.x; arr[4]=p2.y; arr[5]=p2.z;
                            stickLines[i].geometry.attributes.position.needsUpdate = true;
                        });
                    } catch (e) {
                        console.error("推論エラー:", e);
                    }
                }

                // ===== 4ビュー描画（アスペクト比対応） =====
                // 縦表示範囲は ORTHO_HALF_HEIGHT 固定、横はビューポート比に合わせて自動計算
                function updateOrthoCam(cam, viewW, viewH) {
                    const aspect = viewW / viewH;
                    cam.top    =  ORTHO_HALF_HEIGHT;
                    cam.bottom = -ORTHO_HALF_HEIGHT;
                    cam.left   = -ORTHO_HALF_HEIGHT * aspect;
                    cam.right  =  ORTHO_HALF_HEIGHT * aspect;
                    cam.updateProjectionMatrix();
                }

                function renderView(cam, x, y, w, h) {
                    if (cam.isOrthographicCamera) {
                        updateOrthoCam(cam, w, h);
                    } else {
                        cam.aspect = w / h;
                        cam.updateProjectionMatrix();
                    }
                    renderer.setViewport(x, y, w, h);
                    renderer.setScissor(x, y, w, h);
                    renderer.render(scene, cam);
                }

                function renderLoop() {
                    requestAnimationFrame(renderLoop);
                    updatePose();
                    controls.update();

                    const W = canvasContainer.clientWidth;
                    const H = canvasContainer.clientHeight;
                    const halfW = Math.floor(W / 2);
                    const halfH = Math.floor(H / 2);

                    renderer.setClearColor(0x1a1a1a, 1);
                    renderer.clear();

                    // WebGL座標は左下原点
                    renderView(persCam,  0,     halfH, halfW, halfH);
                    renderView(frontCam, halfW, halfH, halfW, halfH);
                    renderView(sideCam,  0,     0,     halfW, halfH);
                    renderView(topCam,   halfW, 0,     halfW, halfH);

                    // ラベル位置（CSSは左上原点）
                    labelPerspective.style.left = '6px';        labelPerspective.style.top = '4px';
                    labelFront.style.left = (halfW + 6) + 'px'; labelFront.style.top = '4px';
                    labelSide.style.left = '6px';               labelSide.style.top = (halfH + 4) + 'px';
                    labelTop.style.left = (halfW + 6) + 'px';   labelTop.style.top = (halfH + 4) + 'px';
                }

                window.addEventListener('resize', () => {
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                    renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
                });

                renderLoop();

            } catch (error) {
                showError("起動エラー", `${error.message || error}\n\nStack:\n${error.stack || '(no stack)'}`);
                console.error(error);
            }
        }

        main();
    </script>
</body>
</html>
