<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web 3D Motion Capture (with Progress)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; touch-action: none; }
    </style>
</head>
<body class="text-gray-200 h-screen flex flex-col font-sans">

    <!-- ヘッダー -->
    <header class="p-3 md:p-4 bg-[#1e1e1e] border-b border-[#333] flex justify-between items-center z-10 shadow-md">
        <div>
            <h1 class="text-base md:text-xl font-bold tracking-wider text-blue-400">3D MOTION AI</h1>
        </div>
        <div class="flex items-center gap-2">
            <input type="file" id="video-upload" accept="video/mp4,video/mov,video/webm" class="hidden">
            <button id="upload-btn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-700 disabled:text-gray-400 text-sm md:text-base px-4 py-2 rounded-full font-semibold transition-colors flex items-center gap-2 shadow">
                動画を選択
            </button>
        </div>
    </header>
    
    <!-- メインコンテンツ領域 -->
    <div class="flex-1 flex flex-col p-2 gap-2 overflow-hidden bg-[#0a0a0a]">
        
        <!-- 左側/上部：動画プレーヤー -->
        <div class="flex-1 bg-black rounded-lg border border-[#333] relative overflow-hidden flex justify-center items-center shadow-lg">
            <video id="input-video" class="max-h-full max-w-full object-contain" controls loop playsinline muted></video>
            
            <!-- ローディングとプログレスバー -->
            <div id="overlay" class="absolute inset-0 bg-[#111] bg-opacity-95 flex flex-col items-center justify-center z-10 transition-opacity duration-500 p-6 text-center">
                <div id="spinner" class="animate-spin rounded-full h-10 w-10 border-4 border-gray-600 border-t-blue-500 mb-4"></div>
                <p id="status-text" class="text-base md:text-lg font-medium tracking-wide">AIの準備をしています...</p>
                <p id="sub-status" class="text-xs md:text-sm text-gray-400 mt-2 mb-4">しばらくお待ちください</p>
                
                <!-- プログレスバーUI -->
                <div id="progress-container" class="w-full max-w-xs hidden">
                    <div class="w-full bg-gray-700 rounded-full h-2.5 mb-1 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-sm font-bold text-blue-400">0%</p>
                </div>

                <div id="error-box" class="hidden mt-4 p-3 bg-red-900/40 border border-red-500/50 rounded text-red-200 text-xs text-left w-full max-w-sm break-all overflow-y-auto max-h-32"></div>
            </div>
        </div>

        <!-- 右側/下部：3D描画キャンバス -->
        <div id="canvas-container" class="flex-1 bg-[#1a1a1a] rounded-lg border border-[#333] relative overflow-hidden shadow-lg">
            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur px-2 py-1 text-[10px] md:text-xs text-gray-300 rounded border border-gray-700 pointer-events-none">
                スワイプ: 回転 | ピンチ: 拡大
            </div>
        </div>

    </div>

    <!-- スクリプト -->
    <script type="module">
        // DOM要素
        const video = document.getElementById('input-video');
        const canvasContainer = document.getElementById('canvas-container');
        const uploadBtn = document.getElementById('upload-btn');
        const videoUpload = document.getElementById('video-upload');
        const overlay = document.getElementById('overlay');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('status-text');
        const subStatus = document.getElementById('sub-status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const errorBox = document.getElementById('error-box');

        // エラー表示用
        function showError(msg, details = "") {
            spinner.classList.add('hidden');
            progressContainer.classList.add('hidden');
            statusText.innerText = msg;
            statusText.classList.add('text-red-400');
            subStatus.innerText = "通信環境を確認してページを再読み込みしてください。";
            if (details) {
                errorBox.classList.remove('hidden');
                errorBox.innerText = details;
            }
        }

        // 予期せぬエラーのキャッチ
        window.onerror = (message, source, lineno, colno, error) => {
            showError("予期せぬエラーが発生しました", `${message}`);
        };

        // 進捗付きでファイルをダウンロードする関数
        async function fetchWithProgress(url, onProgress) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`ダウンロード失敗: HTTP ${response.status}`);
            
            const contentLength = response.headers.get('content-length');
            const total = contentLength ? parseInt(contentLength, 10) : 0;
            let loaded = 0;

            const reader = response.body.getReader();
            const chunks = [];

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                loaded += value.length;
                
                if (total) {
                    const pct = Math.round((loaded / total) * 100);
                    onProgress(pct);
                } else {
                    onProgress(-1, loaded);
                }
            }

            const blob = new Blob(chunks, { type: 'application/octet-stream' });
            return URL.createObjectURL(blob);
        }

        // メイン処理（動的読み込みによりフリーズを防ぐ）
        async function main() {
            try {
                // =====================================
                // 1. プログラム（ライブラリ）の取得
                // =====================================
                statusText.innerText = "手順(1/4): プログラムを取得中...";
                subStatus.innerText = "3DとAIのライブラリを読み込んでいます";

                // 動的インポート（ここで止まってもエラーがキャッチできる）
                const THREE = await import('three');
                const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
                // ↓ ここを unpkg から jsdelivr に変更
                const { PoseLandmarker, FilesetResolver } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js');

                // =====================================
                // 2. 3D空間のセットアップ
                // =====================================
                statusText.innerText = "手順(2/4): 3D空間を準備中...";
                subStatus.innerText = "キャンバスを構築しています";

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x1a1a1a);
                const camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 100);
                camera.position.set(0, 1.2, 4.5);

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                canvasContainer.appendChild(renderer.domElement);

                const controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 0.5, 0);

                scene.add(new THREE.AmbientLight(0xffffff, 0.7));
                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(2, 5, 3);
                scene.add(dirLight);

                const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
                grid.position.y = -0.49;
                scene.add(grid);

                const joints = [];
                const bones = [];
                const skeletonGroup = new THREE.Group();
                scene.add(skeletonGroup);

                const jointGeo = new THREE.SphereGeometry(0.04, 12, 12);
                const defaultMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
                const highlightMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

                for (let i = 0; i < 33; i++) {
                    const mat = [11, 12, 23, 24].includes(i) ? highlightMat : defaultMat;
                    const sphere = new THREE.Mesh(jointGeo, mat);
                    skeletonGroup.add(sphere);
                    joints.push(sphere);
                }

                const POSE_CONNECTIONS = [
                    [0,1], [1,2], [2,3], [3,7], [0,4], [4,5], [5,6], [6,8], [9,10],
                    [11,12], [11,23], [12,24], [23,24],
                    [11,13], [13,15], [15,17], [15,19], [15,21], [17,19],
                    [12,14], [14,16], [16,18], [16,20], [16,22], [18,20],
                    [23,25], [25,27], [27,29], [27,31], [31,29],
                    [24,26], [26,28], [28,30], [28,32], [32,30]
                ];

                const boneMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa });
                const spineMatRed = new THREE.LineBasicMaterial({ color: 0xef4444 });
                const spineMatBlue = new THREE.LineBasicMaterial({ color: 0x3b82f6 });

                POSE_CONNECTIONS.forEach((conn) => {
                    let mat = boneMat;
                    if (conn[0] === 11 && conn[1] === 23) mat = spineMatRed;
                    if (conn[0] === 12 && conn[1] === 24) mat = spineMatBlue;
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
                    const line = new THREE.Line(geo, mat);
                    skeletonGroup.add(line);
                    bones.push(line);
                });

                // =====================================
                // 3. AIエンジンの準備
                // =====================================
                statusText.innerText = "手順(3/4): AIエンジンを準備中...";
                subStatus.innerText = "ブラウザの環境を整えています";
                // ↓ ここも unpkg から jsdelivr に変更
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );

                // =====================================
                // 4. AIモデルのダウンロード
                // =====================================
                statusText.innerText = "手順(4/4): AIモデルをダウンロード中...";
                subStatus.innerText = "約7MBのデータを取得します";
                progressContainer.classList.remove('hidden');
                
                const modelUrl = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
                
                const localModelUrl = await fetchWithProgress(modelUrl, (pct, loadedBytes) => {
                    if (pct >= 0) {
                        progressBar.style.width = `${pct}%`;
                        progressText.innerText = `${pct}%`;
                    } else {
                        progressText.innerText = `${Math.round(loadedBytes / 1024 / 1024 * 10) / 10} MB ダウンロード済`;
                        progressBar.style.width = '100%';
                        progressBar.classList.add('animate-pulse');
                    }
                });
                
                progressContainer.classList.add('hidden');
                statusText.innerText = "最終調整中...";
                subStatus.innerText = "モデルを起動しています";

                const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: localModelUrl,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });
                
                // 完了！
                spinner.classList.add('hidden');
                statusText.innerText = "準備完了！";
                subStatus.innerText = "上の「動画を選択」ボタンから動画を選んでください";
                uploadBtn.disabled = false;
                
                setTimeout(() => {
                    if (video.src === "") overlay.style.backgroundColor = "rgba(17, 17, 17, 0.7)";
                }, 1000);

                // =====================================
                // 5. イベントと描画ループ
                // =====================================
                uploadBtn.addEventListener('click', () => videoUpload.click());

                videoUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.classList.add('hidden'), 500);

                    if (video.src) URL.revokeObjectURL(video.src);
                    video.src = URL.createObjectURL(file);
                    video.load();
                    video.play();
                });

                let lastVideoTime = -1;
                function renderLoop() {
                    requestAnimationFrame(renderLoop);

                    if (video.readyState >= 2 && !video.paused && video.currentTime !== lastVideoTime && poseLandmarker) {
                        lastVideoTime = video.currentTime;
                        
                        try {
                            const results = poseLandmarker.detectForVideo(video, performance.now());
                            if (results.worldLandmarks && results.worldLandmarks.length > 0) {
                                const landmarks = results.worldLandmarks[0];
                                const offsetY = 0.8;
                                const scale = 1.3;

                                landmarks.forEach((lm, i) => {
                                    joints[i].position.set(-lm.x * scale, -lm.y * scale + offsetY, -lm.z * scale);
                                });

                                POSE_CONNECTIONS.forEach((conn, i) => {
                                    const p1 = joints[conn[0]].position;
                                    const p2 = joints[conn[1]].position;
                                    const pos = bones[i].geometry.attributes.position.array;
                                    pos[0] = p1.x; pos[1] = p1.y; pos[2] = p1.z;
                                    pos[3] = p2.x; pos[4] = p2.y; pos[5] = p2.z;
                                    bones[i].geometry.attributes.position.needsUpdate = true;
                                });
                            }
                        } catch(e) {
                            console.error("推論エラー:", e);
                        }
                    }

                    controls.update();
                    renderer.render(scene, camera);
                }

                window.addEventListener('resize', () => {
                    camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
                });

                renderLoop();

            } catch (error) {
                // いずれかの手順で失敗した場合、ここにエラーが出る
                showError("起動エラー", error.message || error.toString());
                console.error(error);
            }
        }

        // アプリ起動
        main();

    </script>
</body>
</html>
