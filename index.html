<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Web 3D Motion Capture - 安定版</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>
<style>
body{margin:0;overflow:hidden;background:#0f172a;touch-action:none;font-family:system-ui,-apple-system,sans-serif}
#canvas-container{position:relative;width:100%;flex:1;background:#0f172a}
#main-canvas{display:block;width:100%;height:100%}

/* ★ 動画を大きく・リサイズ可能に */
#video-wrap{
  position:absolute; right:10px; bottom:10px;
  width:420px; max-width:60vw;
  border:2px solid #60a5fa; border-radius:6px;
  background:#000; z-index:35;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  resize: both; overflow:hidden;
  min-width:160px; min-height:90px;
}
#input-video{
  display:block; width:100%; height:100%;
  object-fit:contain; background:#000;
}
#video-label{
  position:absolute; left:0; top:0;
  background:rgba(59,130,246,.9); color:#fff;
  font-size:10px; font-weight:bold;
  padding:2px 6px; border-radius:0 0 4px 0;
  z-index:36; pointer-events:none;
}
#video-size-hint{
  position:absolute; right:4px; bottom:2px;
  color:#94a3b8; font-size:9px; pointer-events:none;
  background:rgba(0,0,0,.5); padding:1px 4px; border-radius:3px;
}

#loading-overlay{position:absolute;inset:0;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px;text-align:center}
#error-box{display:none;position:absolute;top:10px;left:10px;right:10px;background:rgba(220,38,38,.95);color:#fff;padding:10px;border-radius:6px;font-size:11px;z-index:60;white-space:pre-wrap;max-height:50vh;overflow:auto}
#debug-panel{position:absolute;top:60px;right:10px;background:rgba(0,0,0,.6);color:#34d399;font-family:monospace;font-size:10px;padding:6px;border-radius:4px;z-index:40;pointer-events:none;min-width:160px}
.view-label{position:absolute;color:#94a3b8;font-size:10px;font-weight:bold;pointer-events:none;z-index:30;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:3px}
.btn{padding:6px 10px;border-radius:6px;font-size:12px;background:#334155;color:#e2e8f0;border:1px solid #475569;cursor:pointer;transition:all .2s}
.btn:hover{background:#475569}
.btn.active{background:#3b82f6;border-color:#60a5fa;color:#fff}
.progress-bar{width:280px;height:8px;background:#334155;border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);transition:width .2s;width:0%}
</style>
</head>
<body class="text-gray-200 h-screen flex flex-col">

<header class="bg-slate-800 border-b border-slate-700 px-3 py-2 flex flex-wrap items-center gap-2">
  <h1 class="text-sm font-bold flex-shrink-0">🎬 3D Motion Capture</h1>
  <label class="btn flex-shrink-0">📁 動画を選択<input type="file" id="file-input" accept="video/*" class="hidden"></label>
  <div class="flex gap-1 flex-shrink-0">
    <button class="btn active" data-view="avatar">🧍 3D</button>
    <button class="btn" data-view="stick">🦴 骨格</button>
    <button class="btn" data-view="both">🧍🦴 両方</button>
  </div>
  <div class="flex gap-1 flex-shrink-0">
    <label class="text-xs text-gray-400">人数:</label>
    <select id="num-persons" class="btn">
      <option value="1" selected>1人</option>
      <option value="2">2人</option>
      <option value="3">3人</option>
    </select>
  </div>
  <button id="reset-btn" class="btn flex-shrink-0">🔄 基準リセット</button>
  <button id="toggle-video-btn" class="btn flex-shrink-0">📹 動画表示</button>
  <button id="video-size-btn" class="btn flex-shrink-0">🔍 動画サイズ</button>
</header>

<div id="canvas-container">
  <canvas id="main-canvas"></canvas>
  <div id="video-wrap">
    <video id="input-video" playsinline muted></video>
    <div id="video-label">📹 INPUT</div>
    <div id="video-size-hint">右下ドラッグでリサイズ</div>
  </div>
  <div class="view-label" style="left:8px;top:8px">PERSPECTIVE</div>
  <div class="view-label" id="lbl-front">FRONT</div>
  <div class="view-label" id="lbl-side">SIDE</div>
  <div class="view-label" id="lbl-top">TOP</div>
  <div id="debug-panel">待機中...</div>
  <div id="error-box"></div>
  <div id="loading-overlay">
    <div class="text-lg font-bold mb-2">🤖 AIの準備をしています</div>
    <div id="status-text" class="text-sm text-gray-300">初期化中...</div>
    <div id="sub-status" class="text-xs text-gray-500 mt-1">&nbsp;</div>
    <div id="progress-container" class="progress-bar hidden"><div id="progress-fill" class="progress-fill"></div></div>
  </div>
</div>

<footer class="bg-slate-800 border-t border-slate-700 px-3 py-1 text-xs text-gray-400">
  <span id="footer-info">準備完了後に動画を選択してください</span>
</footer>

<script type="module">
const statusText = document.getElementById('status-text');
const subStatus = document.getElementById('sub-status');
const overlay = document.getElementById('loading-overlay');
const errorBox = document.getElementById('error-box');
const progressContainer = document.getElementById('progress-container');
const progressFill = document.getElementById('progress-fill');
const debugPanel = document.getElementById('debug-panel');
const footerInfo = document.getElementById('footer-info');
const video = document.getElementById('input-video');
const videoWrap = document.getElementById('video-wrap');
const videoLabel = document.getElementById('video-label');
const canvas = document.getElementById('main-canvas');

let currentStep = '初期化前';
function setStep(label, sub=''){ currentStep=label; statusText.innerText=label; subStatus.innerText=sub; }
function showError(msg){ errorBox.style.display='block'; errorBox.innerText=`直前ステップ: ${currentStep}\n\n${msg}`; console.error(msg); }
window.addEventListener('error', e => showError(`window.error: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', e => {
  const msg = e.reason?.message || String(e.reason||'');
  if(msg.includes('message channel closed') || msg.includes('listener indicated')) return;
  showError(`unhandledrejection: ${msg}\n${e.reason?.stack||''}`);
});

let videoVisible = true;
document.getElementById('toggle-video-btn').addEventListener('click', () => {
  videoVisible = !videoVisible;
  videoWrap.style.display = videoVisible ? 'block' : 'none';
});

// ★ 動画サイズプリセット切り替えボタン
const videoSizes = ['small','medium','large','xlarge'];
const sizeMap = { small:'240px', medium:'420px', large:'600px', xlarge:'820px' };
let videoSizeIdx = 1;
document.getElementById('video-size-btn').addEventListener('click', () => {
  videoSizeIdx = (videoSizeIdx + 1) % videoSizes.length;
  videoWrap.style.width = sizeMap[videoSizes[videoSizeIdx]];
  videoWrap.style.height = ''; // aspect-ratioを動画自身に任せる
});

// 動画ロード時にアスペクト比に合わせて高さ調整
video.addEventListener('loadedmetadata', () => {
  const w = videoWrap.offsetWidth;
  const ratio = video.videoHeight / Math.max(video.videoWidth,1);
  videoWrap.style.height = (w * ratio) + 'px';
});

// ===== パラメータ =====
const POSE_SMOOTH      = 0.35;
const POS_SMOOTH       = 0.25;
const VISIBILITY_TH    = 0.5;
const ORTHO_HALF_HEIGHT = 1.5;
const ORTHO_CENTER_Y    = 0.9;
const GROUND_OFFSET    = 0.02;
const GROUND_EPSILON   = 0.005;
const MIN_HIP_HEIGHT   = 0.3;
// しゃがみで画面上の身長が縮んでも、距離推定が急に奥へ飛ばないようにする下限。
const MIN_DISTANCE_HEIGHT_RATIO = 0.75;
const SCENE_WIDTH      = 6.0;
const REF_DISTANCE     = 4.0;
const MAX_PERSONS      = 3;

async function main(){
  setStep('three.js 読み込み中...');
  const THREE = await import('three');
  setStep('アドオン読み込み中...');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
  const { clone: skeletonClone } = await import('three/addons/utils/SkeletonUtils.js');
  setStep('MediaPipe 読み込み中...');
  const mp = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs');
  const { PoseLandmarker, FilesetResolver } = mp;

  setStep('3D空間構築中...');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);
  scene.fog = new THREE.Fog(0x0f172a, 12, 35);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 0.7));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2);
  dl.position.set(3, 8, 4); dl.castShadow = true;
  dl.shadow.mapSize.set(2048,2048);
  dl.shadow.camera.left=-6; dl.shadow.camera.right=6;
  dl.shadow.camera.top=6; dl.shadow.camera.bottom=-6;
  scene.add(dl);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30,30),
    new THREE.MeshStandardMaterial({color:0x1e293b, roughness:0.85})
  );
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);
  scene.add(new THREE.GridHelper(30, 30, 0x475569, 0x334155));

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.setScissorTest(true);

  const camPersp = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camPersp.position.set(5, 3.5, 7);
  camPersp.lookAt(0, 0.9, 0);
  const camFront = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camFront.position.set(0, ORTHO_CENTER_Y, 10); camFront.lookAt(0, ORTHO_CENTER_Y, 0);
  const camSide = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camSide.position.set(10, ORTHO_CENTER_Y, 0); camSide.lookAt(0, ORTHO_CENTER_Y, 0);
  const camTop = new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  camTop.position.set(0, 15, 0); camTop.lookAt(0, 0, 0); camTop.up.set(0,0,-1);

  const controls = new OrbitControls(camPersp, canvas);
  controls.target.set(0, 0.9, 0);
  controls.enableDamping = true;
  controls.minDistance = 2;
  controls.maxDistance = 30;

  function updateOrthoCam(cam, w, h){
    const aspect = w / Math.max(h, 1);
    const halfH = ORTHO_HALF_HEIGHT * 1.5;
    const halfW = halfH * aspect;
    cam.left = -halfW; cam.right = halfW;
    cam.top = halfH; cam.bottom = -halfH;
    cam.updateProjectionMatrix();
  }

  setStep('キャラクターモデル読み込み中...');
  const XBOT_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r158/examples/models/gltf/Xbot.glb';
  const gltfTemplate = await new Promise((resolve, reject) => {
    new GLTFLoader().load(XBOT_URL, resolve, undefined, err => reject(new Error('GLTF: '+err.message)));
  });

  const PERSON_COLORS = [0xef4444, 0x3b82f6, 0x10b981];
  const STICK_BONES = [
    [11,13],[13,15],[12,14],[14,16],
    [11,12],[23,24],[11,23],[12,24],
    [23,25],[25,27],[27,31],
    [24,26],[26,28],[28,32],
  ];

  function measureBindDirs(avatar){
    avatar.updateMatrixWorld(true);
    const bones = {};
    avatar.traverse(o => { if(o.isBone) bones[o.name] = o; });
    function localChildDir(parent, child){
      if(!parent || !child) return new THREE.Vector3(0,1,0);
      const pw = new THREE.Vector3(); parent.getWorldPosition(pw);
      const cw = new THREE.Vector3(); child.getWorldPosition(cw);
      const dirW = cw.sub(pw).normalize();
      const pq = new THREE.Quaternion(); parent.getWorldQuaternion(pq);
      return dirW.applyQuaternion(pq.invert()).normalize();
    }
    return {
      lShoulder: localChildDir(bones.mixamorigLeftArm, bones.mixamorigLeftForeArm),
      lElbow:    localChildDir(bones.mixamorigLeftForeArm, bones.mixamorigLeftHand),
      rShoulder: localChildDir(bones.mixamorigRightArm, bones.mixamorigRightForeArm),
      rElbow:    localChildDir(bones.mixamorigRightForeArm, bones.mixamorigRightHand),
      lHip:      localChildDir(bones.mixamorigLeftUpLeg, bones.mixamorigLeftLeg),
      lKnee:     localChildDir(bones.mixamorigLeftLeg, bones.mixamorigLeftFoot),
      rHip:      localChildDir(bones.mixamorigRightUpLeg, bones.mixamorigRightLeg),
      rKnee:     localChildDir(bones.mixamorigRightLeg, bones.mixamorigRightFoot),
      spine:     localChildDir(bones.mixamorigSpine, bones.mixamorigSpine1),
      spine1:    localChildDir(bones.mixamorigSpine1, bones.mixamorigSpine2),
      neck:      localChildDir(bones.mixamorigNeck, bones.mixamorigHead),
    };
  }

  class Person {
    constructor(id, bindDirs){
      this.id = id;
      this.color = PERSON_COLORS[id % PERSON_COLORS.length];
      this.bindDirs = bindDirs;

      this.avatar = skeletonClone(gltfTemplate.scene);
      this.avatar.traverse(o => {
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
          if(o.material){
            o.material = o.material.clone();
            if(o.material.color) o.material.color.setHex(this.color);
          }
        }
      });
      scene.add(this.avatar);

      const bn = {};
      this.avatar.traverse(o => { if(o.isBone) bn[o.name] = o; });
      this.B = {
        hips: bn.mixamorigHips,
        spine: bn.mixamorigSpine,
        spine1: bn.mixamorigSpine1,
        spine2: bn.mixamorigSpine2,
        neck: bn.mixamorigNeck,
        head: bn.mixamorigHead,
        lShoulder: bn.mixamorigLeftArm,
        lElbow: bn.mixamorigLeftForeArm,
        rShoulder: bn.mixamorigRightArm,
        rElbow: bn.mixamorigRightForeArm,
        lHip: bn.mixamorigLeftUpLeg,
        lKnee: bn.mixamorigLeftLeg,
        lAnkle: bn.mixamorigLeftFoot,
        rHip: bn.mixamorigRightUpLeg,
        rKnee: bn.mixamorigRightLeg,
        rAnkle: bn.mixamorigRightFoot,
      };
      this.bindHipsPos = this.B.hips.position.clone();
      this.bindHipsQuat = this.B.hips.quaternion.clone();

      this.avatar.updateMatrixWorld(true);
      const hp = new THREE.Vector3(); this.B.hips.getWorldPosition(hp);
      const ap = new THREE.Vector3(); this.B.lAnkle.getWorldPosition(ap);
      this.xbotHipToFoot = Math.abs(hp.y - ap.y);

      // ★ バインド時の hips のワールド「右(+X)」「上(+Y)」「前(+Z)」を計測
      //    Xbot は T-pose で正面が +Z 方向を向いている
      const hipsWQ = new THREE.Quaternion();
      this.B.hips.getWorldQuaternion(hipsWQ);
      this.bindHipsWorldQuat = hipsWQ.clone();

      this.stickGroup = new THREE.Group();
      scene.add(this.stickGroup);
      this.joints = [];
      const jMat = new THREE.MeshStandardMaterial({color:this.color});
      const jGeo = new THREE.SphereGeometry(0.03, 12, 12);
      for(let i=0;i<33;i++){
        const m = new THREE.Mesh(jGeo, jMat);
        m.castShadow = true;
        this.stickGroup.add(m); this.joints.push(m);
      }
      const bMat = new THREE.MeshStandardMaterial({color:0x60a5fa});
      this.sticks = STICK_BONES.map(()=>{
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,1,8), bMat);
        m.castShadow = true; this.stickGroup.add(m); return m;
      });

      this.smoothedHip = new THREE.Vector3();
      this.smoothedHipQuat = new THREE.Quaternion().copy(this.bindHipsQuat);
      this.posInited = false;
      this.active = false;
      this.lastPx = 0; this.lastPy = 0;
      this.avatarBox = new THREE.Box3();
      this.groundLift = 0;
    }
    setVisible(showAvatar, showStick){
      this.avatar.visible = this.active && showAvatar;
      this.stickGroup.visible = this.active && showStick;
    }
    resetPose(){
      this.B.hips.quaternion.copy(this.bindHipsQuat);
      this.B.hips.position.copy(this.bindHipsPos);
      this.avatar.position.y = 0;
      this.groundLift = 0;
      this.smoothedHipQuat.copy(this.bindHipsQuat);
    }
  }

  const tempAvatar = skeletonClone(gltfTemplate.scene);
  scene.add(tempAvatar);
  const bindDirs = measureBindDirs(tempAvatar);
  scene.remove(tempAvatar);
  console.log('Bind dirs measured:', bindDirs);

  const persons = [];
  for(let i=0;i<MAX_PERSONS;i++) persons.push(new Person(i, bindDirs));

  let viewMode = 'avatar';
  function refreshVisibility(){
    const sa = (viewMode === 'avatar' || viewMode === 'both');
    const ss = (viewMode === 'stick' || viewMode === 'both');
    persons.forEach(p => p.setVisible(sa, ss));
  }
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      viewMode = btn.dataset.view;
      refreshVisibility();
    });
  });

  setStep('AIエンジン初期化中...');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm');
  setStep('AIモデルダウンロード中...');
  progressContainer.classList.remove('hidden');
  const modelUrl = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task';
  const res = await fetch(modelUrl);
  const reader = res.body.getReader();
  const total = parseInt(res.headers.get('content-length')||'12000000', 10);
  let received = 0; const chunks = [];
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    chunks.push(value); received += value.length;
    progressFill.style.width = Math.min(100, received/total*100)+'%';
  }
  const buf = new Uint8Array(received);
  let off=0; for(const c of chunks){ buf.set(c, off); off+=c.length; }
  progressContainer.classList.add('hidden');

  let numPosesWanted = parseInt(document.getElementById('num-persons').value, 10);
  let poseLandmarker;
  async function createPoseLandmarker(numPoses){
    if(poseLandmarker){ try{ poseLandmarker.close(); }catch(e){} }
    try {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions:{modelAssetBuffer:buf, delegate:'GPU'},
        runningMode:'VIDEO', numPoses
      });
    } catch(e) {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions:{modelAssetBuffer:buf, delegate:'CPU'},
        runningMode:'VIDEO', numPoses
      });
    }
  }
  await createPoseLandmarker(numPosesWanted);
  document.getElementById('num-persons').addEventListener('change', async e => {
    numPosesWanted = parseInt(e.target.value, 10);
    setStep('検出器を再構築中...');
    overlay.style.display = 'flex';
    await createPoseLandmarker(numPosesWanted);
    overlay.style.display = 'none';
    persons.forEach(p => { p.active = false; p.posInited = false; p.resetPose(); });
    refreshVisibility();
  });

  overlay.style.display = 'none';
  footerInfo.innerText = '✓ 準備完了。動画を選択してください。';

  document.getElementById('file-input').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    if(video.src) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(f);
    persons.forEach(p => { p.active = false; p.posInited = false; p.resetPose(); });
    refreshVisibility();
    lastTs = 0; lastVideoTime = -1;
    baselineHeightPx = 0;
    video.play().catch(()=>{});
    footerInfo.innerText = `▶ 解析中: ${f.name}`;
  });
  document.getElementById('reset-btn').addEventListener('click', () => {
    persons.forEach(p => { p.posInited = false; p.resetPose(); });
    baselineHeightPx = 0;
    footerInfo.innerText = '🔄 基準リセット完了';
  });

  // ========== 姿勢適用ロジック ==========
  //
  // 【座標系について】
  //  MediaPipe world landmarks:
  //    x: 被写体の左 → 右が +（カメラから見ると逆。カメラから見て右側は -x）
  //       実際にはMediaPipeの仕様で、x は画像座標系と同じ「画面右が +」。
  //       world landmarks の x も image と同じ向き（被写体目線では左右反転）。
  //    y: 下が +
  //    z: カメラに近い方が -
  //  Three.js: y上, z画面手前
  //
  //  変換: (mp.x, mp.y, mp.z) → (mp.x, -mp.y, -mp.z) でThree.js座標へ
  //  → Three.js での +X = カメラから見て右 = 被写体の左
  //
  //  Xbot のバインドポーズ:
  //    アバターは +Z 方向（カメラの手前側）を正面として立っている
  //    つまり画面奥に背中、手前にお腹
  //  → 被写体が「画面に対して正面（カメラを向いている）」のとき、
  //    アバターは手前(+Z)を向くべき = カメラ目線で「こちらを向く」
  //
  function lmToVec3(lm, out){ out.set(lm.x, -lm.y, -lm.z); return out; }

  function setBoneDirection(bone, dirWorld, bindDirLocal, smooth=POSE_SMOOTH){
    if(!bone || !bone.parent) return;
    bone.parent.updateWorldMatrix(true, false);
    const parentQ = new THREE.Quaternion();
    bone.parent.getWorldQuaternion(parentQ);
    const dirLocal = dirWorld.clone().applyQuaternio
